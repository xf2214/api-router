<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" rx="16" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g opacity="0.06" stroke="#22d3ee" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="280" y1="0" x2="280" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
    <line x1="700" y1="0" x2="700" y2="380"/>
  </g>

  <!-- =============== LAYER 1: CLIENT APPS =============== -->
  <text x="60" y="40" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1.5">USER / CLIENT</text>

  <g transform="translate(30, 60)">
    <!-- Chat bubble -->
    <rect x="0" y="0" width="80" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="20" cy="22" r="5" fill="#22d3ee"/>
    <rect x="30" y="17" width="34" height="8" rx="4" fill="#22d3ee" opacity="0.5"/>
    <rect x="10" y="38" width="60" height="6" rx="3" fill="#347"/>
    <rect x="10" y="48" width="42" height="6" rx="3" fill="#334155"/>
    <text x="40" y="86" font-family="Inter,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="600">APP</text>
  </g>

  <g transform="translate(30, 170)">
    <!-- Code editor -->
    <rect x="0" y="0" width="80" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="0" y="0" width="80" height="18" rx="12" fill="#0f172a"/>
    <circle cx="12" cy="9" r="3" fill="#f87171"/>
    <circle cx="22" cy="9" r="3" fill="#facc15"/>
    <circle cx="32" cy="9" r="3" fill="#34d399"/>
    <rect x="8" y="28" width="18" height="4" rx="2" fill="#f59e0b"/>
    <rect x="28" y="28" width="36" height="4" rx="2" fill="#475569"/>
    <rect x="8" y="38" width="56" height="4" rx="2" fill="#64748b"/>
    <rect x="8" y="48" width="30" height="4" rx="2" fill="#22d3ee" opacity="0.7"/>
    <text x="40" y="86" font-family="Inter,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="600">CURL / SDK</text>
  </g>

  <g transform="translate(30, 280)">
    <!-- Terminal -->
    <rect x="0" y="0" width="80" height="64" rx="12" fill="#020617" stroke="#334155"/>
    <rect x="0" y="0" width="80" height="18" rx="12" fill="#111827"/>
    <circle cx="12" cy="9" r="3" fill="#f87171"/>
    <circle cx="22" cy="9" r="3" fill="#facc15"/>
    <circle cx="32" cy="9" r="3" fill="#34d399"/>
    <text x="8" y="40" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#34d399">$</text>
    <text x="18" y="40" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#e2e8f0">api-router</text>
    <rect x="8" y="54" width="6" height="2" fill="#22d3ee"/>
    <text x="40" y="86" font-family="Inter,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="600">IDE / CLI</text>
  </g>

  <!-- =============== LAYER 2: LOCAL HTTP SERVER =============== -->
  <text x="308" y="40" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1.5">LOCAL ENDPOINT · 127.0.0.1:6123</text>
  <g transform="translate(160, 110)" filter="url(#glow)">
    <rect x="0" y="0" width="240" height="200" rx="16" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="240" height="48" rx="16" fill="#155e75" opacity="0.3"/>
    <text x="120" y="30" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="middle">HTTP SERVER (AXUM)</text>
    <!-- endpoints list -->
    <g transform="translate(16, 64)">
      <rect x="0" y="0" width="208" height="22" rx="6" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-width="0.5"/>
      <text x="10" y="15" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#67e8f9">/v1/models</text>
    </g>
    <g transform="translate(16, 92)">
      <rect x="0" y="0" width="208" height="22" rx="6" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-width="0.5"/>
      <text x="10" y="15" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#67e8f9">/v1/chat/completions</text>
    </g>
    <g transform="translate(16, 120)">
      <rect x="0" y="0" width="208" height="22" rx="6" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-width="0.5"/>
      <text x="10" y="15" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#67e8f9">/v1/embeddings</text>
    </g>
    <g transform="translate(16, 148)">
      <rect x="0" y="0" width="208" height="22" rx="6" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="0.5"/>
      <text x="10" y="15" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#ddd6fe">SSE streaming ✦</text>
    </g>
  </g>

  <!-- Arrows: Clients -> Server -->
  <g fill="none" stroke="url(#stream)" stroke-width="2.5" stroke-linecap="round">
    <path d="M 110 92 C 140 92, 140 140, 160 140"/>
    <path d="M 110 202 C 140 202, 140 200, 160 200"/>
    <path d="M 110 312 C 140 312, 140 260, 160 260"/>
  </g>
  <polygon points="157,134 164,140 157,146" fill="#22d3ee"/>
  <polygon points="157,194 164,200 157,206" fill="#22d3ee"/>
  <polygon points="157,254 164,260 157,266" fill="#22d3ee"/>

  <!-- =============== LAYER 3: ROUTING CORE =============== -->
  <text x="555" y="40" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1.5">RUST ROUTING CORE</text>
  <g transform="translate(460, 90)" filter="url(#glow)">
    <rect x="0" y="0" width="220" height="240" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="220" height="44" rx="16" fill="#5b21b6" opacity="0.3"/>
    <text x="110" y="28" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#c4b5fd" text-anchor="middle">ROUTER · FALLBACK · LB</text>
    <g font-family="Inter,sans-serif" font-size="11" fill="#cbd5e1">
      <g transform="translate(18,64)">
        <circle cx="8" cy="6" r="5" fill="#34d399"/>
        <text x="22" y="10">Priority / Weighted / RR</text>
      </g>
      <g transform="translate(18,88)">
        <circle cx="8" cy="6" r="5" fill="#f59e0b"/>
        <text x="22" y="10">Circuit Breaker · Retry</text>
      </g>
      <g transform="translate(18,112)">
        <circle cx="8" cy="6" r="5" fill="#f472b6"/>
        <text x="22" y="10">Tiered Fallback</text>
      </g>
      <g transform="translate(18,136)">
        <circle cx="8" cy="6" r="5" fill="#60a5fa"/>
        <text x="22" y="10">QPS · Concurrency Limit</text>
      </g>
      <g transform="translate(18,160)">
        <circle cx="8" cy="6" r="5" fill="#22d3ee"/>
        <text x="22" y="10">🔐 Keyring Encrypted</text>
      </g>
      <g transform="translate(18,184)">
        <circle cx="8" cy="6" r="5" fill="#fb7185"/>
        <text x="22" y="10">Health Check · Auto-Isolate</text>
      </g>
    </g>
  </g>

  <!-- Arrow: Server -> Router -->
  <g fill="none" stroke="url(#stream)" stroke-width="2.5" stroke-linecap="round">
    <path d="M 400 210 C 430 210, 430 210, 460 210"/>
  </g>
  <polygon points="457,204 464,210 457,216" fill="#a78bfa"/>

  <!-- =============== LAYER 4: UPSTREAM =============== -->
  <text x="780" y="40" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1.5">UPSTREAM LLMs</text>

  <g transform="translate(720,70)">
    <rect x="0" y="0" width="160" height="52" rx="12" fill="#1e293b" stroke="#475569"/>
    <circle cx="26" cy="26" r="14" fill="#10b981" opacity="0.2"/>
    <path d="M 18 26 a 8 8 0 1 1 16 0 a 8 8 0 1 1 -16 0" stroke="#10b981" stroke-width="2" fill="none" opacity="0.8"/>
    <text x="50" y="22" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">OpenAI · Anthropic</text>
    <text x="50" y="38" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">Gemini · Azure</text>
  </g>

  <g transform="translate(720,140)">
    <rect x="0" y="0" width="160" height="52" rx="12" fill="#1e293b" stroke="#475569"/>
    <circle cx="26" cy="26" r="14" fill="#8b5cf6" opacity="0.2"/>
    <path d="M 20 20 L 32 20 L 32 32 L 20 32 Z" stroke="#8b5cf6" stroke-width="2" fill="none"/>
    <text x="50" y="22" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">DeepSeek · Zhipu</text>
    <text x="50" y="38" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">SenseNova · Moonshot</text>
  </g>

  <g transform="translate(720,210)">
    <rect x="0" y="0" width="160" height="52" rx="12" fill="#1e293b" stroke="#475569"/>
    <circle cx="26" cy="26" r="14" fill="#f59e0b" opacity="0.2"/>
    <path d="M 18 32 L 26 18 L 34 32 Z" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <text x="50" y="22" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">OpenRouter</text>
    <text x="50" y="38" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">Any OpenAI-compatible</text>
  </g>

  <g transform="translate(720,280)">
    <rect x="0" y="0" width="160" height="52" rx="12" fill="#1e293b" stroke="#475569"/>
    <circle cx="26" cy="26" r="14" fill="#ef4444" opacity="0.2"/>
    <path d="M 20 26 L 32 26 M 26 20 L 26 32" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="50" y="22" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Self-Hosted</text>
    <text x="50" y="38" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">Ollama · vLLM · Local Models</text>
  </g>

  <!-- Arrows: Router -> Upstream (multiple) -->
  <g fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M 680 110 C 700 110, 700 96, 720 96"/>
    <path d="M 680 160 C 700 160, 700 166, 720 166"/>
    <path d="M 680 210 C 700 210, 700 236, 720 236"/>
    <path d="M 680 260 C 700 260, 700 306, 720 306"/>
  </g>
  <polygon points="717,90 724,96 717,102" fill="#c4b5fd"/>
  <polygon points="717,160 724,166 717,172" fill="#c4b5fd"/>
  <polygon points="717,230 724,236 717,242" fill="#c4b5fd"/>
  <polygon points="717,300 724,306 717,312" fill="#c4b5fd"/>

  <!-- Local-first label -->
  <text x="450" y="362" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">🔒 全流程本地转发，密钥加密存储，请求数据永不离开你的设备</text>
</svg>
