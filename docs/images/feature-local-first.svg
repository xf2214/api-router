<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glowCard" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- concentric glow circles -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 10" opacity="0.15"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2 8" opacity="0.18"/>
  <circle cx="512" cy="512" r="220" fill="none" stroke="#f472b6" stroke-width="1" stroke-dasharray="1 6" opacity="0.22"/>

  <!-- Central laptop/device silhouette -->
  <g transform="translate(512,512)" filter="url(#glowCard)">
    <!-- body -->
    <rect x="-190" y="-140" width="380" height="250" rx="20" fill="#0b1020" stroke="url(#ringGrad)" stroke-width="2.5"/>
    <!-- screen -->
    <rect x="-170" y="-120" width="340" height="210" rx="14" fill="#020617" stroke="#1e293b"/>
    <!-- base -->
    <rect x="-220" y="110" width="440" height="18" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="-40" y="128" width="80" height="4" rx="2" fill="#475569"/>

    <!-- Shield + Lock on screen -->
    <g transform="translate(0, -30)">
      <!-- Shield -->
      <path d="M 0 -80 L -68 -56 L -68 8 C -68 56, -28 86, 0 100 C 28 86, 68 56, 68 8 L 68 -56 Z"
            fill="#064e3b" fill-opacity="0.5" stroke="#22d3ee" stroke-width="2.5"/>
      <!-- Lock body -->
      <rect x="-28" y="-10" width="56" height="52" rx="10" fill="#22d3ee" fill-opacity="0.9"/>
      <!-- Lock shackle -->
      <path d="M -18 -10 L -18 -34 A 18 18 0 0 1 18 -34 L 18 -10"
            fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
      <!-- Keyhole -->
      <circle cx="0" cy="16" r="7" fill="#020617"/>
      <rect x="-3" y="16" width="6" height="14" rx="2" fill="#020617"/>
    </g>

    <!-- Screen label: encrypted config path -->
    <g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#94a3b8" text-anchor="middle">
      <text x="0" y="120">🔑 OS Keyring (encrypted, plaintext never saved)</text>
    </g>
  </g>

  <!-- Orbiting icons: key, shield, vault, check -->
  <g font-size="14" fill="#cbd5e1" font-family="Inter,sans-serif" font-weight="600">
    <!-- key icon (top-left) -->
    <g transform="translate(220,260)">
      <circle cx="0" cy="0" r="44" fill="#0b1020" stroke="#22d3ee" stroke-width="1.5"/>
      <path d="M -8 -10 A 14 14 0 1 1 8 10 L 18 20 L 24 14 L 24 8 L 32 8 L 32 2 L 20 2 Z" fill="#22d3ee" transform="translate(-8,-8) scale(1.2)"/>
      <text x="0" y="74" fill="#67e8f9" text-anchor="middle">Keys Secured</text>
    </g>
    <!-- shield icon (top-right) -->
    <g transform="translate(804,260)">
      <circle cx="0" cy="0" r="44" fill="#0b1020" stroke="#a78bfa" stroke-width="1.5"/>
      <path d="M 0 -22 L -18 -14 L -18 4 C -18 20, -8 30, 0 36 C 8 30, 18 20, 18 4 L 18 -14 Z" fill="#a78bfa"/>
      <text x="0" y="74" fill="#ddd6fe" text-anchor="middle">Zero Data Leaks</text>
    </g>
    <!-- vault (bottom-left) -->
    <g transform="translate(220,770)">
      <circle cx="0" cy="0" r="44" fill="#0b1020" stroke="#f472b6" stroke-width="1.5"/>
      <g transform="translate(-22,-22)">
        <rect x="0" y="0" width="44" height="44" rx="6" fill="#f472b6" fill-opacity="0.9"/>
        <circle cx="22" cy="22" r="10" fill="#020617"/>
        <rect x="20" y="14" width="4" height="10" rx="1" fill="#f472b6"/>
      </g>
      <text x="0" y="74" fill="#f9a8d4" text-anchor="middle">Local Vault</text>
    </g>
    <!-- checkmark seal (bottom-right) -->
    <g transform="translate(804,770)">
      <circle cx="0" cy="0" r="44" fill="#0b1020" stroke="#34d399" stroke-width="1.5"/>
      <path d="M -16 2 L -4 14 L 18 -10" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="74" fill="#86efac" text-anchor="middle">No Telemetry</text>
    </g>
  </g>

  <!-- Connecting dashed lines (icons -> central laptop) -->
  <g stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.35" fill="none">
    <line x1="220" y1="260" x2="362" y2="412"/>
    <line x1="804" y1="260" x2="662" y2="412"/>
    <line x1="220" y1="770" x2="362" y2="612"/>
    <line x1="804" y1="770" x2="662" y2="612"/>
  </g>

  <!-- Caption -->
  <g transform="translate(512, 920)" font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <text font-size="32" font-weight="800" fill="#f8fafc">Your API Keys. Your Data.</text>
    <text x="0" y="42" font-size="20" font-weight="500" fill="#94a3b8">Always on-device. Never leaves your machine.</text>
  </g>
</svg>
