          <rect x="16" y="14" width="10" height="26" rx="2" fill="#22d3ee" opacity="0.6"/>
          <rect x="32" y="28" width="10" height="12" rx="2" fill="#22d3ee" opacity="0.4"/>
          <rect x="48" y="6" width="10" height="34" rx="2" fill="#22d3ee" opacity="0.8"/>
          <rect x="64" y="20" width="10" height="20" rx="2" fill="#22d3ee" opacity="0.55"/>
          <rect x="80" y="12" width="10" height="28" rx="2" fill="#22d3ee" opacity="0.7"/>
          <rect x="96" y="4" width="10" height="36" rx="2" fill="#a78bfa"/>
          <rect x="112" y="18" width="10" height="22" rx="2" fill="#22d3ee" opacity="0.6"/>
          <rect x="128" y="26" width="10" height="14" rx="2" fill="#22d3ee" opacity="0.45"/>
          <rect x="144" y="10" width="10" height="30" rx="2" fill="#22d3ee" opacity="0.75"/>
          <rect x="160" y="16" width="10" height="24" rx="2" fill="#22d3ee" opacity="0.6"/>
          <rect x="176" y="2" width="10" height="38" rx="2" fill="#22d3ee"/>
          <rect x="192" y="22" width="10" height="18" rx="2" fill="#22d3ee" opacity="0.55"/>
          <rect x="208" y="12" width="10" height="28" rx="2" fill="#a78bfa" opacity="0.9"/>
          <rect x="224" y="30" width="10" height="10" rx="2" fill="#22d3ee" opacity="0.4"/>
          <rect x="240" y="18" width="10" height="22" rx="2" fill="#22d3ee" opacity="0.65"/>
          <rect x="256" y="8" width="10" height="32" rx="2" fill="#22d3ee" opacity="0.8"/>
          <rect x="272" y="22" width="10" height="18" rx="2" fill="#22d3ee" opacity="0.55"/>
          <rect x="288" y="16" width="10" height="24" rx="2" fill="#22d3ee" opacity="0.7"/>
          <rect x="304" y="0" width="10" height="40" rx="2" fill="#22d3ee"/>
        </g>
      </g>

      <!-- Provider health list -->
      <g transform="translate(16, 306)" font-family="Inter,sans-serif" font-size="11" fill="#cbd5e1">
        <rect x="0" y="0" width="332" height="82" rx="10" fill="#0b1220" stroke="#334155"/>
        <text x="12" y="18" font-size="10" fill="#64748b" font-weight="700">PROVIDER HEALTH</text>
