        </g>
        <g transform="translate(14, 116)">
          <text x="26" y="20">🌳  Routing Tree</text>
        </g>
        <g transform="translate(14, 146)">
          <text x="26" y="20">📊  Monitoring</text>
        </g>
        <g transform="translate(14, 176)">
