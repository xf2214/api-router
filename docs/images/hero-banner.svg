          <text x="12" y="22" font-family="Inter,sans-serif" font-size="10" fill="#64748b">AVG LATENCY</text>
          <text x="12" y="50" font-family="Inter,sans-serif" font-size="24" font-weight="800" fill="#f9a8d4">42 ms</text>
          <text x="120" y="50" font-family="Inter,sans-serif" font-size="10" fill="#34d399">-6ms</text>
        </g>
        <g transform="translate(176, 82)">
          <rect x="0" y="0" width="162" height="68" rx="10" fill="#0b1220" stroke="#facc15" stroke-opacity="0.4"/>
          <text x="12" y="22" font-family="Inter,sans-serif" font-size="10" fill="#64748b">TOKENS (24h)</text>
          <text x="12" y="50" font-family="Inter,sans-serif" font-size="22" font-weight="800" fill="#fde68a">2.6M</text>
          <text x="120" y="50" font-family="Inter,sans-serif" font-size="10" fill="#34d399">OK</text>
        </g>
      </g>

