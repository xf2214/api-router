        <text x="80" y="29" fill="#e2e8f0" text-anchor="middle">🚀 Get Started</text>
      </g>
      <g transform="translate(366,0)">
        <rect x="0" y="0" width="130" height="46" rx="12" fill="#0b1020" stroke="#334155"/>
        <text x="65" y="29" fill="#e2e8f0" text-anchor="middle">⭐ Star</text>
      </g>
    </g>
