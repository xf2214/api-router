<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="heroBg" cx="0.7" cy="0.3" r="1.1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#heroBg)"/>

  <!-- Ambient light blobs -->
  <circle cx="1060" cy="120" r="200" fill="#22d3ee" opacity="0.08"/>
  <circle cx="200" cy="600" r="260" fill="#a78bfa" opacity="0.08"/>
  <circle cx="780" cy="480" r="180" fill="#f472b6" opacity="0.06"/>

  <!-- Faint grid -->
  <g opacity="0.07" stroke="#22d3ee" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="120" y1="0" x2="120" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="360" y1="0" x2="360" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="600" y1="0" x2="600" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="840" y1="0" x2="840" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1080" y1="0" x2="1080" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
