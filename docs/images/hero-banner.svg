  <!-- Animated-looking data stream arcs (decorative, left -> window) -->
  <g fill="none" stroke="url(#streamGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
    <path d="M 420 220 C 470 160, 520 180, 590 160"/>
    <path d="M 420 260 C 470 280, 520 240, 590 250"/>
    <path d="M 420 300 C 470 360, 520 320, 590 330"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="590" cy="160" r="3.5"/>
    <circle cx="590" cy="250" r="3.5"/>
    <circle cx="590" cy="330" r="3.5"/>
