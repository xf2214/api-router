          <text x="12" y="50" font-family="Inter,sans-serif" font-size="24" font-weight="800" fill="#c4b5fd">48</text>
          <text x="120" y="50" font-family="Inter,sans-serif" font-size="10" fill="#34d399">98.2%</text>
        </g>
        <g transform="translate(0, 82)">
