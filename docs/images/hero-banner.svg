  <!-- ================ LEFT: Brandmark + Slogan ================ -->
  <g transform="translate(90, 120)">
    <!-- Logo: Stylized routing node -->
    <g filter="url(#glowBig)">
      <circle cx="42" cy="42" r="42" fill="#0b1020" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="42" cy="42" r="22" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <path d="M 28 42 L 42 28 L 56 42 L 42 56 Z" fill="#22d3ee"/>
      <circle cx="72" cy="18" r="10" fill="#f472b6" opacity="0.9"/>
      <circle cx="80" cy="58" r="7" fill="#facc15" opacity="0.9"/>
      <circle cx="14" cy="64" r="6" fill="#34d399" opacity="0.9"/>
    </g>

    <text x="0" y="160" font-family="Inter,system-ui,sans-serif" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-2">
      <tspan fill="#22d3ee">API</tspan> Router
    </text>

    <text x="2" y="206" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
      One local endpoint. All LLMs. Zero lock-in.
    </text>

    <text x="2" y="238" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="400" fill="#64748b">
      本地运行 · 轻量桌面应用 · 统一大模型 API 路由 · Rust + Tauri v2
    </text>

    <!-- Tag chips -->
    <g transform="translate(0, 270)" font-family="Inter,sans-serif" font-size="12" font-weight="600">
      <g>
        <rect x="0" y="0" width="96" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.4"/>
        <text x="48" y="19" fill="#67e8f9" text-anchor="middle">Local-First</text>
      </g>
      <g transform="translate(108,0)">
        <rect x="0" y="0" width="108" height="28" rx="14" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4"/>
        <text x="54" y="19" fill="#ddd6fe" text-anchor="middle">OpenAI API</text>
      </g>
      <g transform="translate(228,0)">
        <rect x="0" y="0" width="100" height="28" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1" stroke-opacity="0.4"/>
        <text x="50" y="19" fill="#86efac" text-anchor="middle">Tauri v2</text>
      </g>
      <g transform="translate(340,0)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
        <text x="55" y="19" fill="#fcd34d" text-anchor="middle">Rust 1.97+</text>
      </g>
    </g>

    <!-- CTA buttons (visual only) -->
    <g transform="translate(0, 340)" font-family="Inter,sans-serif" font-size="15" font-weight="700">
      <g>
        <rect x="0" y="0" width="170" height="46" rx="12" fill="url(#accentGrad)"/>
        <rect x="0" y="0" width="170" height="46" rx="12" fill="#22d3ee" opacity="0.1"/>
        <text x="85" y="29" fill="#021018" text-anchor="middle">⬇  Download Now</text>
      </g>
      <g transform="translate(190,0)">
