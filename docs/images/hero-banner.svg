        <rect x="0" y="0" width="332" height="84" rx="10" fill="#0b1220" stroke="#334155"/>
        <text x="12" y="18" font-family="Inter,sans-serif" font-size="10" fill="#64748b" font-weight="700">REQ PER MIN · LAST HOUR</text>
        <g transform="translate(18, 40)">
