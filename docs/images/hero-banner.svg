  <!-- Footnote / port label -->
  <text x="640" y="662" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#64748b" text-anchor="middle">
    $ curl http://127.0.0.1:6123/v1/chat/completions · Local OpenAI-compatible endpoint
  </text>
