        <g transform="translate(0, 26)">
          <circle cx="16" cy="10" r="4" fill="#22c55e"/>
          <text x="28" y="14" font-weight="600">OpenAI</text>
          <rect x="140" y="4" width="150" height="12" rx="6" fill="#1e293b"/>
          <rect x="140" y="4" width="136" height="12" rx="6" fill="#22d3ee"/>
          <text x="308" y="14" fill="#34d399" font-weight="700" text-anchor="end">90.7%</text>
        </g>
        <g transform="translate(0, 50)">
          <circle cx="16" cy="10" r="4" fill="#22c55e"/>
